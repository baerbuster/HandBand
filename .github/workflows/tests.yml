name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is the development version. The rest prove the code isn't
        # tied to it -- nothing here uses version-gated syntax or stdlib
        # APIs. 3.8 and 3.9 are past end-of-life, so they're not tested.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Tk plus a virtual display, so the GUI suites (test_views.py) really
      # run here instead of skipping. They skip cleanly without a display,
      # so this makes the runner stricter, never flakier.
      - name: Tk and a virtual display
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb

      # pytest is the only Python dependency, and only for the tests. The
      # app itself runs on the standard library alone.
      - run: pip install pytest

      # pytest.ini scopes collection to handband/tests.
      - run: xvfb-run -a pytest

      # The suites also run standalone, with no pytest at all. Guarding
      # that path here keeps it from rotting -- it's the mode that keeps
      # the project dependency-free.
      - name: standalone runner
        run: |
          for f in handband/tests/test_*.py; do
            xvfb-run -a python3 -m "handband.tests.$(basename "$f" .py)" || exit 1
          done

  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Tk and a virtual display
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb

      - run: pip install pytest coverage

      - name: measure
        run: xvfb-run -a coverage run -m pytest -q

      # Printed in full, then gated. The floor is deliberately below the
      # real number (92%): it catches a suite quietly falling out of the
      # run -- if the GUI tests ever start skipping here, coverage drops
      # far past this and the job says so.
      - name: report
        run: |
          coverage report
          {
            echo '## Coverage'
            echo '```'
            coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          coverage report --fail-under=90
