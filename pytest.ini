[pytest]
# Only the current system's suites. `legacy/` holds two files matching
# pytest's default patterns (simple_test.py, click_test.py) that import
# matplotlib and other things the archive never had pinned -- collecting
# them fails before any real test runs.
#
# testpaths covers a bare `pytest`; norecursedirs also covers an explicit
# `pytest .`, where testpaths is ignored.
testpaths = handband/tests
norecursedirs = legacy docs .git
